name: tests

on:
  push:
  workflow_dispatch:

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run test:unit

  integration:
    name: integracion (Supabase local)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: back

      # El proyecto de Supabase (config.toml + migrations) vive en el repo del
      # front. Si ccdt es privado hace falta un PAT con permiso de lectura en el
      # secret CCDT_FRONT_TOKEN; si es publico alcanza con el token del workflow.
      - uses: actions/checkout@v4
        with:
          repository: amorales1989/ccdt
          path: front
          token: ${{ secrets.CCDT_FRONT_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: back/package-lock.json

      # Version fija: es la que esta probada contra este config.toml y este baseline.
      # Con `latest` el CLI puede cambiar los nombres que emite `status -o env`.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.104.0

      - name: Levantar la Supabase local
        working-directory: front
        run: supabase start

      # El esquema copiado de prod arrastra dos Database Webhooks que hacen POST a
      # un host externo en cada INSERT/UPDATE de profiles y events. El runner no
      # tiene pg_net, asi que sin esto falla hasta el INSERT del fixture.
      - name: Desactivar los webhooks en la DB de tests
        working-directory: front
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -E 's/"//g' | grep -E '^DB_URL=' | cut -d= -f2-)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f ../back/tests/sql/preparar-db-tests.sql

      # Mismo archivo que en local (ver tests/README.md). El guard de
      # tests/helpers/env.js corta si esto no apunta a 127.0.0.1.
      # Se aceptan los dos juegos de nombres: el CLI viejo emite ANON_KEY /
      # SERVICE_ROLE_KEY y el nuevo PUBLISHABLE_KEY / SECRET_KEY.
      - name: Generar .env.test
        working-directory: front
        run: |
          set -euo pipefail
          RAW="$(supabase status -o env | sed -E 's/"//g')"
          leer() { printf '%s\n' "$RAW" | grep -E "^$1=" | head -1 | cut -d= -f2-; }

          ANON="$(leer ANON_KEY)";          [ -n "$ANON" ]    || ANON="$(leer PUBLISHABLE_KEY)"
          SERVICE="$(leer SERVICE_ROLE_KEY)"; [ -n "$SERVICE" ] || SERVICE="$(leer SECRET_KEY)"

          {
            echo "NODE_ENV=test"
            echo "SUPABASE_URL=$(leer API_URL)"
            echo "SUPABASE_ANON_KEY=$ANON"
            echo "SUPABASE_SERVICE_KEY=$SERVICE"
            echo "JWT_SECRET=$(leer JWT_SECRET)"
          } > ../back/.env.test

      # Falla con un mensaje claro si el CLI cambio los nombres. Imprime solo las
      # claves del archivo, nunca los valores.
      - name: Verificar .env.test
        working-directory: back
        run: |
          for v in SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_KEY JWT_SECRET; do
            grep -qE "^$v=.+" .env.test || { echo "::error::falta $v en .env.test (cambiaron los nombres de 'supabase status -o env'?)"; exit 1; }
          done
          echo "Variables escritas: $(grep -oE '^[A-Z_]+' .env.test | tr '\n' ' ')"

      - name: Instalar dependencias
        working-directory: back
        run: npm ci

      - name: Tests de integracion
        working-directory: back
        run: npm run test:integration
